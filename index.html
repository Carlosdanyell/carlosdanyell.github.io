    <!-- Tema antes da primeira pintura: escolha salva ou claro (padrão). -->
    <script>
      ;(function () {
        var theme
        try {
          theme = localStorage.getItem('cd:theme')
        } catch (e) {}
        // Claro por padrão; o escuro só entra quando escolhido no menu.
        if (theme !== 'light' && theme !== 'dark') theme = 'light'
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0A0F1A')
        try {
          // O HTML vem pré-renderizado em português: quem escolheu inglês só vê a página
          // depois que o React troca o idioma (a classe sai no I18nProvider).
          if (localStorage.getItem('cd:lang') === 'en') {
            document.documentElement.lang = 'en'
            document.documentElement.classList.add('lang-pending')
          }
        } catch (e) {}
      })()
    </script>
