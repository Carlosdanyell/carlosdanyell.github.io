name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas para publicar no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; o que estiver em andamento termina antes do próximo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Recorta as fontes, checa os tipos, gera o build e pré-renderiza o HTML.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
